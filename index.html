<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت‌بات ره نگار گستر</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .container {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(145deg, #1a1a1a, #0f0f0f);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            pointer-events: none;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #ED2F42, transparent);
            top: -150px;
            right: -150px;
            animation: float 15s infinite;
        }

        .bg-animation::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #ED2F42, transparent);
            bottom: -125px;
            left: -125px;
            animation: float 20s infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 50px) scale(1.2); }
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1f1f1f, #141414);
            padding: 20px;
            border-bottom: 3px solid #ED2F42;
            box-shadow: 0 4px 20px rgba(237, 47, 66, 0.2);
            z-index: 10;
            position: relative;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .bot-avatar {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #ED2F42 0%, #ff1744 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 25px rgba(237, 47, 66, 0.5);
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 8px 25px rgba(237, 47, 66, 0.5); }
            50% { box-shadow: 0 8px 35px rgba(237, 47, 66, 0.8); }
        }

        .header-info h1 {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .online-dot {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 12px #00ff88;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }

        .header-info p {
            color: #888;
            font-size: 12px;
            font-weight: 500;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 25px 20px;
            position: relative;
            background: #0f0f0f;
        }

        .chat-area::-webkit-scrollbar {
            width: 6px;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ED2F42, #c72537);
            border-radius: 10px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        /* Messages */
        .msg {
            display: flex;
            margin-bottom: 20px;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.user {
            justify-content: flex-end;
        }

        .msg-avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .msg.bot .msg-avatar {
            background: linear-gradient(135deg, #ED2F42, #c72537);
            margin-left: 10px;
        }

        .msg.user .msg-avatar {
            background: linear-gradient(135deg, #3a3a3a, #2a2a2a);
            margin-right: 10px;
        }

        .msg-bubble {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
        }

        .msg.bot .msg-bubble {
            background: linear-gradient(135deg, #2a2a2a, #1f1f1f);
            color: #f0f0f0;
            border: 1px solid rgba(237, 47, 66, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .msg.user .msg-bubble {
            background: linear-gradient(135deg, #ED2F42, #c72537);
            color: #fff;
            box-shadow: 0 4px 20px rgba(237, 47, 66, 0.5);
        }

        /* Typing Animation */
        .typing {
            display: none;
            padding: 14px 18px;
            background: linear-gradient(135deg, #2a2a2a, #1f1f1f);
            border-radius: 18px;
            width: fit-content;
        }

        .typing-dots {
            display: flex;
            gap: 6px;
        }

        .typing-dots span {
            width: 9px;
            height: 9px;
            background: #ED2F42;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-12px);
            }
        }

        /* Welcome */
        .welcome {
            text-align: center;
            padding: 60px 20px;
        }

        .welcome-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: wave 2s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-20deg); }
        }

        .welcome h2 {
            color: #ED2F42;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #999;
            font-size: 15px;
            line-height: 1.8;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background: linear-gradient(135deg, #1a1a1a, #141414);
            border-top: 1px solid #2a2a2a;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }

        .input-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            background: #242424;
            padding: 8px;
            border-radius: 28px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: #ED2F42;
            box-shadow: 0 0 0 4px rgba(237, 47, 66, 0.15);
        }

        #chatInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            padding: 12px 16px;
            font-family: 'Vazirmatn', sans-serif;
        }

        #chatInput::placeholder {
            color: #666;
        }

        #sendBtn {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #ED2F42, #ff1744);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(237, 47, 66, 0.4);
        }

        #sendBtn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 25px rgba(237, 47, 66, 0.6);
        }

        #sendBtn:active {
            transform: scale(0.95);
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }

        /* Desktop */
        @media (min-width: 768px) {
            .container {
                max-width: 900px;
                height: 90vh;
                border-radius: 24px;
                box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
            }

            .header {
                border-radius: 24px 24px 0 0;
            }

            .msg-bubble {
                max-width: 60%;
            }
        }

        /* Mobile Adjustments */
        @media (max-width: 767px) {
            .header {
                padding: 16px;
            }

            .bot-avatar {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }

            .header-info h1 {
                font-size: 16px;
            }

            .chat-area {
                padding: 20px 15px;
            }

            .msg-bubble {
                max-width: 80%;
                font-size: 14px;
                padding: 12px 16px;
            }

            .msg-avatar {
                width: 36px;
                height: 36px;
                font-size: 18px;
            }

            .input-area {
                padding: 15px;
            }

            #sendBtn {
                width: 48px;
                height: 48px;
                font-size: 20px;
            }

            .welcome {
                padding: 40px 20px;
            }

            .welcome-icon {
                font-size: 50px;
            }

            .welcome h2 {
                font-size: 20px;
            }

            .welcome p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bg-animation"></div>
        
        <div class="header">
            <div class="header-content">
                <div class="bot-avatar">🤖</div>
                <div class="header-info">
                    <h1>
                        دستیار هوشمند ره نگار گستر
                        <span class="online-dot"></span>
                    </h1>
                    <p>پاسخگویی آنی 24/7</p>
                </div>
            </div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="welcome">
                <div class="welcome-icon">👋</div>
                <h2>به ره نگار گستر خوش آمدید!</h2>
                <p>سلام! من دستیار هوشمند شما هستم.<br>چطور می‌تونم کمکتون کنم؟</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="chatInput" 
                    placeholder="پیام خود را بنویسید..."
                    autocomplete="off"
                >
                <button id="sendBtn">
                    <span>▶</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://rgbot.n8nsaz.ir/webhook/chatbot';
        const chatArea = document.getElementById('chatArea');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, isUser) {
            const welcome = document.querySelector('.welcome');
            if (welcome) welcome.remove();

            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${isUser ? 'user' : 'bot'}`;
            msgDiv.innerHTML = `
                <div class="msg-avatar">${isUser ? '👤' : '🤖'}</div>
                <div class="msg-bubble">${text}</div>
            `;
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'msg bot';
            typingDiv.id = 'typing';
            typingDiv.innerHTML = `
                <div class="msg-avatar">🤖</div>
                <div class="typing" style="display: block;">
                    <div class="typing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            chatArea.appendChild(typingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            chatInput.value = '';
            sendBtn.disabled = true;
            showTyping();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({chatInput: message})
                });

                const data = await response.json();
                hideTyping();

                if (data.output) {
                    addMessage(data.output, false);
                } else {
                    addMessage('متأسفم، خطایی رخ داد. لطفاً دوباره تلاش کنید.', false);
                }
            } catch (error) {
                hideTyping();
                addMessage('خطا در برقراری ارتباط. لطفاً بعداً تلاش کنید.', false);
            }

            sendBtn.disabled = false;
            chatInput.focus();
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) {
                sendMessage();
            }
        });

        chatInput.focus();
    </script>
</body>
</html>
